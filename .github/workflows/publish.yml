name: Publish

# n8n only verifies community nodes published from GitHub Actions with npm provenance.
# A release is a reviewed pull request that bumps the version in package.json. Once it merges,
# this workflow publishes that version to npm, then tags the commit and creates a GitHub release.
on:
  push:
    branches:
      - main

# Never cancel a release halfway through; queue later merges behind it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Only jobs in this environment can publish: the npm trusted publisher requires it, and its
    # deployment branch policy only admits main.
    environment: npm

    permissions:
      # Mints the OIDC token used for Trusted Publishing and the provenance attestation.
      id-token: write
      # Creates the version tag and GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for an unreleased version
        id: check
        # Checked separately so that re-running a failed release only redoes the unfinished steps.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.check.outputs.published != 'true'
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.check.outputs.published != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # Writes an .npmrc for registry.npmjs.org that npm publish authenticates against.
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache, so a poisoned cache can't leak into a published build.

      - name: Upgrade npm
        if: steps.check.outputs.published != 'true'
        # Trusted Publishing needs npm 11.5.1 or later, newer than some Node 24 releases bundle.
        run: 'npm install -g npm@^11.5.1'

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        run: 'pnpm install --frozen-lockfile'

      - name: Publish
        if: steps.check.outputs.published != 'true'
        # In GitHub Actions, n8n-node release runs lint and build, then npm publish with provenance.
        run: 'pnpm run release'
        env:
          # Prereleases such as 1.0.0-rc.1 go to the "next" dist-tag so they don't become "latest".
          NPM_CONFIG_TAG: ${{ contains(steps.check.outputs.version, '-') && 'next' || 'latest' }}

      - name: Tag and create the GitHub release
        if: steps.check.outputs.tagged != 'true'
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes "${prerelease[@]}"
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
