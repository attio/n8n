name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded PR runs to save CI minutes, but let every push to main finish so each commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match local dev, which pins the version in .nvmrc.
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: 'pnpm install --frozen-lockfile'

      - name: Run lint
        run: 'pnpm run lint'

      - name: Run build
        run: 'pnpm run build'
